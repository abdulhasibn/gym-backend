<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0e16" />
  <title>Gym Backend — Capability Orbit 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="orbit-3d.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport" aria-label="3D capability orbit">
    <canvas id="c"></canvas>
  </div>

  <header class="chrome brand">
    <p class="eyebrow">Gym Backend · API MVP</p>
    <h1>Gym Backend</h1>
    <p class="lede">A sculptural map of the MVP — three orbits from invite to retention.</p>
  </header>

  <nav class="chrome nav" aria-label="Views">
    <a href="index.html">2D</a>
    <span aria-current="page">3D</span>
  </nav>

  <div class="chrome legend" aria-label="Ownership legend">
    <span class="lg gym"><i></i> Gym</span>
    <span class="lg client"><i></i> Client</span>
    <span class="lg platform"><i></i> Platform</span>
    <span class="lg done"><i></i> Shipped</span>
  </div>

  <aside class="chrome dock" id="dock" aria-live="polite" data-ownership="done">
    <p class="dock-kicker" id="dock-kicker">Foundation</p>
    <h2 class="dock-title" id="dock-title">Core is lit</h2>
    <p class="dock-body" id="dock-body">Auth and gym-orgs are shipped. Click a node to inspect the next build step.</p>
    <dl class="dock-meta" id="dock-meta" hidden></dl>
    <p class="dock-exit" id="dock-exit" hidden></p>
  </aside>

  <p class="chrome hint">Drag to orbit · scroll to zoom · click a node</p>

  <script type="module" src="orbit-3d.js"></script>
</body>
</html>
